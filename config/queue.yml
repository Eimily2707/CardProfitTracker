default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Dedicated worker for the CardTrader catalog queue (§9.1); matches the
    # limits_concurrency: 3 on SyncExpansionBlueprintsJob.
    - queues: "ct_catalog"
      threads: 3
      processes: 1
      polling_interval: 1
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
