# PostgreSQL 16+. One shared database per environment (Solid Queue, Solid
# Cache and Solid Cable tables live in it too - see
# db/migrate/*_create_solid_queue_cache_cable_tables.rb - rather than the
# separate physical databases Rails' default template splits them into.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: card_profit_tracker_development

test:
  <<: *default
  database: card_profit_tracker_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "card_profit_tracker_production") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "card_profit_tracker") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
