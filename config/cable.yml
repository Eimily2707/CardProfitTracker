# solid_cable in every environment (single shared Postgres database, no
# connects_to split - see config/database.yml): the default :async adapter
# only pub/subs within one process, so a Turbo Stream broadcast from a
# Solid Queue job (a separate process from bin/rails server) would never
# reach the browser without this.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
