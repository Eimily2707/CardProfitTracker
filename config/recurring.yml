# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # CardTrader regenerates its export files nightly, a bit after midnight
  # Italian time (§9.6) - syncing more often than once a day just burns the
  # shared API budget for no new data. Configurable via env if the export
  # window ever shifts.
  sync_cardtrader_catalog:
    class: Cardtrader::SyncCatalogJob
    queue: ct_catalog
    args: [ { trigger: "schedule" } ]
    schedule: <%= ENV.fetch("CARDTRADER_CATALOG_SYNC_CRON", "0 3 * * * Europe/Rome") %>

  # spec §6.10 US-10.1: a confirmed recurring expense proposes its next
  # period's draft once that period arrives.
  generate_recurring_expense_drafts:
    class: Expenses::GenerateRecurringDraftsJob
    queue: default
    schedule: every day at 4am
